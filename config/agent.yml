github:
  organization: pizza-to-the-polls
  appId: 4486291
  installationId: 151233951
  projectNumber: 1
  # App boundary = the installation (operator decision 2026-10-28: expansive —
  # keep the app installed org-wide; discovery loops see every repo below).
  # Executing work still requires a per-repo `repositories:` entry with
  # nodeVersion + checks — that's the second gate.
  repositories:
    - pizza-to-the-polls/pizzabase
    - pizza-to-the-polls/polls.pizza
    - pizza-to-the-polls/feedflag
    - pizza-to-the-polls/hotnready
    - pizza-to-the-polls/pizza-eagle
    - pizza-to-the-polls/democracy-delicious-agent
    - pizza-to-the-polls/data-maps
    - pizza-to-the-polls/power-the-polls
    - pizza-to-the-polls/power-the-polls-form
    - pizza-to-the-polls/powerdash
    - pizza-to-the-polls/powerthepolls
    - pizza-to-the-polls/ptp-actionkit
    - pizza-to-the-polls/ptp-retool-components
    - pizza-to-the-polls/zapier

paths:
  githubPrivateKey: ~/.config/democracy-delicious/github-app.pem
  environmentFile: ~/.config/democracy-delicious/env
  workspace: ~/PizzaAgent

models:
  planner:
    id: deepseek/deepseek-v4-flash
    thinking: medium
  executor:
    id: z-ai/glm-5.3-flash
    thinking: medium
  reviewer:
    id: google/gemini-2.5-flash-lite
    thinking: high

repositories:
  pizza-to-the-polls/feedflag:
    nodeVersion: "22"
    checks:
      # Mirror .github/workflows/test.yml exactly (prettier -> lint -> tsc -> npm
      # test). tsc-only let PR #36 reach CI unformatted and let issue #38's
      # self-tests fail unseen: the reviewer ACCEPTed on a green tsc while
      # `npm test` was red.
      fix: npx --yes prettier --write "src/**/*.ts" "scripts/**/*.ts"
      full:
        - npx --yes prettier --check "src/**/*.ts" "scripts/**/*.ts"
        - npm run lint
        - npx tsc --noEmit
        - npm test
  pizza-to-the-polls/pizzabase:
    nodeVersion: "22"
    testDatabasePrefix: pizzabase_agent
    checks:
      fix: npm run fix
      targeted: npm test -- --runTestsByPath src/lib/exif.test.ts src/controller/UploadsController.test.ts
      full:
        - npm run prettier
        - npm run lint
        - npx tsc --noEmit
        - npm test
  pizza-to-the-polls/polls.pizza:
    nodeVersion: "20"
    checks:
      fix: npm run fix
      full:
        - npm run prettier
        - npm run lint
        - npm test
  pizza-to-the-polls/pizza-eagle:
    nodeVersion: "24"
    checks:
      full:
        - npm run check
        - npm test
        - npm run build
  pizza-to-the-polls/zapier:
    nodeVersion: "24"
    checks:
      # Tier-0 offline gates (no Zapier MCP needed): unit tests + tsc.
      # Integration validation (validate --unsafe, golden harvest) is
      # operator/orchestrator-side — it needs ZAPIER_MCP_URL in the
      # dispatching environment, which the env sanitizer passes through.
      full:
        - npm test
        - npm run check

budget:
  # Uncapped by policy (user decision 2026-10-22: "no longer an experiment it's a
  # success — lifetime spend is infinite until the machine god removes money").
  # Values are non-binding sentinels: schema requires positive numbers and
  # dailyUsd <= autonomousStopUsd <= absoluteUsd, so literal removal would
  # fail-closed. The OpenRouter key's own spend cap is the physical backstop.
  dailyUsd: 100000
  autonomousStopUsd: 1000000
  absoluteUsd: 1000000

limits:
  # Honored by runAuto/daemon since 2026-10-28 (was declared-not-enforced before):
  # up to this many per-issue work pipelines run concurrently in the run
  # phase (per-issue locks still serialize same-issue workers across
  # daemons and manual `work` runs; each issue has its own worktree, branch,
  # state file, and test database).
  globalConcurrency: 3
  issueWallClockMinutes: 45
  maxModelTurns: 30
  maxTestRuns: 4
  maxRepairCycles: 3
